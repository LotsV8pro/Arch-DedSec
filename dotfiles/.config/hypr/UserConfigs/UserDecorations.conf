# D̷E̷D̷S̷E̷C̷ Decorations

general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8

  col.active_border = rgba(B8B0C8cc) rgba(787088cc) 135deg
  col.inactive_border = rgba(B8B0C822) rgba(78708822) 135deg
}

decoration {
  rounding = 10

  active_opacity = 1.0
  inactive_opacity = 0.90
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.12
  dim_special = 0.8

  shadow {
    enabled = true
    range = 15
    render_power = 3
    color = rgba(B8B0C830)
    color_inactive = rgba(78708815)
    offset = 0, 4
  }

  blur {
    enabled = true
    size = 10
    passes = 4
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
    noise = 0.015
    contrast = 1.1
    brightness = 0.8
  }
}

group {
  col.border_active = rgba(B8B0C8cc)
  col.border_inactive = rgba(78708833)

  groupbar {
    col.active = rgba(B8B0C8cc)
    col.inactive = rgba(78708833)
    enabled = true
  }
}
